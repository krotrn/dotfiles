config_version = 13

[bar.default]
center = [ "clock", "screenshot" ]
end = [
    "media",
    "tray",
    "notifications",
    "clipboard",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "battery",
    "wallhaven",
    "session"
]
smart_auto_hide = false
start = [ "workspaces", "audio_visualizer", "gamermode" ]

[battery]
warning_threshold = 25

[control_center.calendar]
show_events_card = false

[dock]
enabled = false

[lockscreen]
blurred_desktop = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[plugin_settings."damian-ds7/battery-threshold"]
battery_device = "/sys/class/power_supply/BAT1"

[plugin_settings."nomadcxx/gamer-mode"]
main_open_near_click = true
main_placement = "floating"

[plugins]
enabled = [
    "frai3mega/battery-graph",
    "noctalia/wallhaven",
    "nzlov/daily-wallpaper",
    "damian-ds7/battery-threshold",
    "nomadcxx/gamer-mode",
    "yocraft/web-launcher"
]

[shell]
avatar_path = "~/.face.icon"
offline_mode = false
polkit_agent = true

    [shell.panel]
    wallpaper_placement = "floating"

    [shell.screenshot]
    remember_last_region = true

[theme]
mode = "dark"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "hyprland", "kitty", "qt", "starship", "sway", "wezterm" ]
    community_ids = [ "antigravity", "neovim", "vscode", "rofi", "hyprtoolkit", "bat", "lazygit", "yazi" ]

[wallpaper]
transition_on_startup = true

    [wallpaper.automation]
    enabled = true

    [wallpaper.default]
    path = "/home/krotrn/Pictures/Wallpapers/daily-wallpaper/bing-en-us-2026-08-22.jpg"

    [wallpaper.last]
    path = "/home/krotrn/Pictures/Wallpapers/daily-wallpaper/bing-en-us-2026-08-22.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/krotrn/Pictures/Wallpapers/daily-wallpaper/bing-en-us-2026-08-22.jpg"

[widget.audio_visualizer]
color_2 = "secondary"

[widget.gamermode]
type = "nomadcxx/gamer-mode:gamermode"

[widget.wallhaven]
type = "noctalia/wallhaven:wallhaven"