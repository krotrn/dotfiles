[bar.default]
background_opacity = 0.7
center = [ "clock", "screenshot" ]
end = [
    "media",
    "tray",
    "notifications",
    "clipboard",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "battery",
    "session"
]
radius = 0
start = [ "workspaces", "audio_visualizer" ]
[location]
auto_locate = true

[dock]
active_monitor_only = true
smart_auto_hide = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "eDP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[plugin_settings."cleboost/hotspot"]
password = "REDACTED"
ssid = "PC Hotspot"

[plugins]
enabled = [ "frai3mega/battery-graph", "nzlov/daily-wallpaper", "noctalia/wallhaven", "cleboost/hotspot" ]

[shell]
button_borders = false
card_borders = false
font_family = "JetBrainsMono Nerd Font"
input_borders = false
popup_borders = false
popup_shadows = false

    [shell.panel]
    control_center_placement = "floating"
    open_near_click_control_center = true
    transparency_mode = "glass"
    wallpaper_placement = "attached"

    [shell.screen_corners]
    size = 1

[theme]
builtin = "Ayu"
community_palette = "GitHub Dark"
mode = "dark"
pure_black_dark = true
source = "community"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "hyprland", "qt", "starship", "sway", "wezterm" ]

[wallpaper.default]
path = "/home/krotrn/Pictures/Wallpapers/daily-wallpaper/bing-en-us-2026-08-03.jpg"

[wallpaper.last]
path = "/home/krotrn/Pictures/Wallpapers/daily-wallpaper/bing-en-us-2026-08-03.jpg"

[wallpaper.monitors.eDP-1]
path = "/home/krotrn/Pictures/Wallpapers/daily-wallpaper/bing-en-us-2026-08-03.jpg"

[[wallpaper.favorite]]
community_palette = "GitHub Dark"
palette_source = "community"
path = "/home/krotrn/Pictures/Wallpapers/daily-wallpaper/bing-en-us-2026-07-28.jpg"
theme_mode = "dark"
