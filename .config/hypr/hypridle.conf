# ╔══════════════════════════════════════════════════════════════════╗
# ║                            HYPRIDLE                              ║
# ╚══════════════════════════════════════════════════════════════════╝
# Dim → screen off → suspend. Video players and browsers in
# fullscreen inhibit this (see windowrules.lua), as does the shell caffeine toggle.
# See: https://wiki.hypr.land/Hypr-Ecosystem/hypridle/

general {
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })' # avoid a second key press to wake the screen
    ignore_dbus_inhibit = false                              # respect apps that inhibit idle (calls, players)
}

# 2.5 min: dim the screen, restore on activity
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

# 5.5 min: screen off
listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })' && brightnessctl -r
}

# 20 min: suspend
listener {
    timeout = 1200
    on-timeout = systemctl suspend
}
