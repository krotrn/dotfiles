# ╔══════════════════════════════════════════════════════════════════╗
# ║                            HYPRIDLE                              ║
# ╚══════════════════════════════════════════════════════════════════╝
# Dim → lock → screen off → suspend. Video players and browsers in
# fullscreen inhibit this (see windowrules.lua), as does Noctalia caffeine.
# See: https://wiki.hypr.land/Hypr-Ecosystem/hypridle/

general {
    lock_cmd = noctalia msg session lock                     # what loginctl lock-session runs
    before_sleep_cmd = loginctl lock-session                 # lock before suspend
    after_sleep_cmd = hyprctl dispatch dpms on               # avoid a second key press to wake the screen
    ignore_dbus_inhibit = false                              # respect apps that inhibit idle (calls, players)
}

# 2.5 min: dim the screen, restore on activity
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

# 5 min: lock
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 5.5 min: screen off
listener {
    timeout = 330
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on && brightnessctl -r
}

# 20 min: suspend
listener {
    timeout = 1200
    on-timeout = systemctl suspend
}
