<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Default fonts for every app (browsers, GTK, Qt): "monospace" is JetBrainsMono Nerd Font.
     Without this rule fontconfig picks Noto Sans Mono. -->
<fontconfig>
  <alias binding="same">
    <family>monospace</family>
    <prefer>
      <family>JetBrainsMono Nerd Font</family>
    </prefer>
  </alias>
</fontconfig>
